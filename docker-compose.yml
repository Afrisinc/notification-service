services:
  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: notification-redis
    command: redis-server --requirepass password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - notification-network

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: notification-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - notification-network

  # Notification Service API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notification-api
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: development
      APP_NAME: notification-service
      PORT: 8010
      HOST: 0.0.0.0
      LOG_LEVEL: debug
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_POOL_MIN: 2
      DATABASE_POOL_MAX: 10
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: password
      RABBITMQ_URL: amqp://admin:password@rabbitmq:5672
      QUEUE_PROVIDER: rabbitmq
      QUEUE_TYPE: bull
      BULL_REDIS_URL: redis://:password@redis:6379/1
      JWT_SECRET: dev-secret-key-change-in-production
      EMAIL_PROVIDER: smtp
      EMAIL_FROM: noreply@example.com
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMS_PROVIDER: twilio
      ENABLE_TRACING: "false"
      ENABLE_METRICS: "true"
      ENABLE_HEALTH_CHECKS: "true"
    ports:
      - "8010:8010"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - notification-network
    command: npm run dev

  # Email Worker Service
  worker-email:
    build:
      context: .
      dockerfile: apps/worker-email/Dockerfile
    container_name: notification-worker-email
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_POOL_MIN: 2
      DATABASE_POOL_MAX: 5
      RABBITMQ_URL: amqp://admin:password@rabbitmq:5672
      QUEUE_PROVIDER: rabbitmq
      EMAIL_PROVIDER: smtp
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: noreply@notification.local
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    networks:
      - notification-network
    command: npm -w @afrisinc-notify/worker-email run start:prod

  # Email Service (MailHog for development)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: notification-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - notification-network

volumes:
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  notification-network:
    driver: bridge
