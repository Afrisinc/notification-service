version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
      POSTGRES_DB: notification_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: notification
      RABBITMQ_DEFAULT_PASS: notification
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: afrisinc-notification:latest
    ports:
      - "8010:8010"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://notification:notification@postgres:5432/notification_db
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://notification:notification@rabbitmq:5672
      SERVICE_CMD: node -r ./register-paths.js dist/services/api/src/server.js
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker-email:
    image: afrisinc-notification:latest
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://notification:notification@postgres:5432/notification_db
      RABBITMQ_URL: amqp://notification:notification@rabbitmq:5672
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SERVICE_CMD: node -r ./register-paths.js dist/services/worker-email/src/index.js
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  worker-sms:
    image: afrisinc-notification:latest
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://notification:notification@postgres:5432/notification_db
      REDIS_URL: redis://redis:6379
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      SERVICE_CMD: node -r ./register-paths.js dist/services/worker-sms/src/index.js
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  worker-inapp:
    image: afrisinc-notification:latest
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://notification:notification@postgres:5432/notification_db
      REDIS_URL: redis://redis:6379
      SERVICE_CMD: node -r ./register-paths.js dist/services/worker-inapp/src/index.js
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
