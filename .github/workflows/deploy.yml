name: Deploy to Kubernetes

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging-api.notification.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.27.0'

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy with Kustomize
        run: |
          kubectl apply -k k8s/overlays/staging/

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/staging-notification-api \
            -n notification-service \
            --timeout=5m

      - name: Verify deployment
        run: |
          kubectl get deployment,pods,svc -n notification-service

      - name: Run smoke tests
        run: |
          # Port forward
          kubectl port-forward svc/staging-notification-api 3000:80 \
            -n notification-service &
          sleep 5

          # Test health endpoint
          curl -f http://localhost:3000/health || exit 1

          # Test API endpoint
          curl -f http://localhost:3000/api/v1 || exit 1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://api.notification.example.com
    needs: deploy-staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.27.0'

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Update image tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          kustomize edit set image notification-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG
        working-directory: k8s/overlays/prod

      - name: Backup current state
        run: |
          kubectl get all,cm,secret -n notification-service -o yaml > backup-$(date +%Y%m%d-%H%M%S).yaml

      - name: Deploy with Kustomize
        run: |
          kubectl apply -k k8s/overlays/prod/

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/prod-notification-api \
            -n notification-service \
            --timeout=10m

      - name: Verify deployment
        run: |
          kubectl get deployment,pods,svc -n notification-service
          kubectl describe deployment prod-notification-api -n notification-service

      - name: Run smoke tests
        run: |
          # Port forward
          kubectl port-forward svc/prod-notification-api 3000:80 \
            -n notification-service &
          sleep 5

          # Test health endpoint
          curl -f https://api.notification.example.com/health || exit 1

      - name: Notify deployment success
        uses: 8398a7/action-slack@v3
        if: success()
        with:
          status: custom
          custom_payload: |
            {
              text: '✅ Production deployment successful',
              attachments: [{
                color: 'good',
                text: `Version: ${process.env.AS_VERSION}`
              }]
            }
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

      - name: Notify deployment failure
        uses: 8398a7/action-slack@v3
        if: failure()
        with:
          status: custom
          custom_payload: |
            {
              text: '❌ Production deployment failed',
              attachments: [{
                color: 'danger',
                text: 'Check GitHub Actions for details'
              }]
            }
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Rolling back to previous version..."
          kubectl rollout undo deployment/prod-notification-api \
            -n notification-service
          kubectl rollout status deployment/prod-notification-api \
            -n notification-service \
            --timeout=5m

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    if: always()
    needs: [deploy-staging, deploy-production]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
          body: |
            ## Changes in this Release
            - See commit history for details

      - name: Send notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Deployment notification'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
