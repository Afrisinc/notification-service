name: Build & Deploy All Services

on:
  push:
    branches:
      - main
      - develop
      - master
  pull_request:
    branches:
      - main
      - develop
      - master

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  # Build and push all 4 services in parallel
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api
          - worker-email
          - worker-sms
          - worker-inapp
      fail-fast: false

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_OWNER }} 
          password: ${{ secrets.GHCR_TOKEN }}  

      - name: Extract metadata for ${{ matrix.service }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.GHCR_OWNER }}/notification-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ secrets.GHCR_OWNER }}/notification-${{ matrix.service }}:buildcache,ignore-error=true
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ secrets.GHCR_OWNER }}/notification-${{ matrix.service }}:buildcache,mode=max,ignore-error=true

  # Deploy to VPS after all services are built
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || 22 }}
          timeout: 30s
          command_timeout: 15m
          script: |
            set -e

            # Set application path
            APP_PATH="${{ secrets.VPS_APP_PATH }}"
            APP_PATH=${APP_PATH:=/opt/apps/afrisinc/notification-service}

            echo "📁 Deploying to: $APP_PATH"
            cd $APP_PATH

            # Login to GitHub Container Registry
            echo "🔐 Authenticating with GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_OWNER }}" \
              --password-stdin

            # Pull latest images for all services
            echo "📥 Pulling latest Docker images..."
            docker compose pull

            # Deploy with new images
            echo "🚀 Deploying services..."
            docker compose up -d --remove-orphans

            # Wait for services to be healthy
            echo "⏳ Waiting for services to start..."
            sleep 5

            # Verify all services are running
            echo "✅ Verifying services..."
            docker compose ps --format "table {{.Service}}\t{{.Status}}"

            # Check health endpoints
            echo "🏥 Checking API health..."
            curl -f http://localhost:8010/health/live || echo "⚠️  Health check warning"

            # Cleanup old images
            echo "🧹 Cleaning up old images..."
            docker image prune -af --filter "until=24h"

            echo "✨ Deployment completed successfully!"
